name: Generate wave

on:
  push:
    paths:
      - generate_wave.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build wave.svg
        run: python generate_wave.py

      - name: Commit wave.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wave.svg
          git diff --staged --quiet || (git commit -m "Regenerate wave.svg" && git push)
